name: publish

on:
  release:
    types: [published]

jobs:
  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  wheels-linux-x86_64:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314, cp314-cp314t]
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - name: Build wheel
        run: |
          /opt/python/${{ matrix.python }}/bin/pip install -U setuptools wheel
          /opt/python/${{ matrix.python }}/bin/pip wheel . --no-build-isolation --no-deps -w /tmp/raw/
          auditwheel repair /tmp/raw/caio-*.whl -w dist/ && rm /tmp/raw/caio-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64-${{ matrix.python }}
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  wheels-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_34_aarch64
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314, cp314-cp314t]
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - name: Build wheel
        run: |
          /opt/python/${{ matrix.python }}/bin/pip install -U setuptools wheel
          /opt/python/${{ matrix.python }}/bin/pip wheel . --no-build-isolation --no-deps -w /tmp/raw/
          auditwheel repair /tmp/raw/caio-*.whl -w dist/ && rm /tmp/raw/caio-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-aarch64-${{ matrix.python }}
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  wheels-musllinux-x86_64:
    runs-on: ubuntu-latest
    container: quay.io/pypa/musllinux_1_2_x86_64
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314, cp314-cp314t]
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - name: Build wheel
        run: |
          /opt/python/${{ matrix.python }}/bin/pip install -U setuptools wheel
          /opt/python/${{ matrix.python }}/bin/pip wheel . --no-build-isolation --no-deps -w /tmp/raw/
          auditwheel repair /tmp/raw/caio-*.whl -w dist/ && rm /tmp/raw/caio-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-musllinux-x86_64-${{ matrix.python }}
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  wheels-musllinux-aarch64:
    # Deliberately NOT run inside `container:` (unlike every other wheels-*
    # job) - GitHub Actions cannot run JavaScript-based actions (checkout,
    # upload-artifact, the gh-release upload) inside an Alpine container on
    # an ARM64 runner ("JavaScript Actions in Alpine containers are only
    # supported on x64 Linux runners" - a known GitHub Actions limitation,
    # architecture-specific, which is why wheels-musllinux-x86_64 doesn't
    # need this workaround). Instead: checkout/upload/release run directly
    # on the plain Ubuntu ARM64 host, and only the actual musl-linked build
    # step below runs inside the musllinux container, invoked explicitly via
    # `docker run` against the checked-out workspace bind-mounted in - the
    # GitHub-hosted ARM64 runner image ships Docker already (proven by every
    # other container:-based job on this same runner type relying on it).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314, cp314-cp314t]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - name: Build wheel
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            quay.io/pypa/musllinux_1_2_aarch64 bash -c '
              /opt/python/${{ matrix.python }}/bin/pip install -U setuptools wheel &&
              /opt/python/${{ matrix.python }}/bin/pip wheel . --no-build-isolation --no-deps -w /tmp/raw/ &&
              auditwheel repair /tmp/raw/caio-*.whl -w dist/ &&
              rm /tmp/raw/caio-*.whl
            '
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-musllinux-aarch64-${{ matrix.python }}
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  wheels-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.python }}
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  wheels-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  pypi:
    needs: [sdist, wheels-linux-x86_64, wheels-linux-aarch64, wheels-musllinux-x86_64, wheels-musllinux-aarch64, wheels-macos, wheels-windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheel-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
