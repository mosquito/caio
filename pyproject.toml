[build-system]
# >=1.9.4 specifically: that's the version maturin started auto-setting
# PYO3_BUILD_EXTENSION_MODULE for the cdylib it builds, which is what lets
# the three backends drop pyo3's own "extension-module" feature (needed so
# each backend's stub_gen bin - see src/*/lib.rs's stub_info() - can still
# link against libpython for pyo3-stub-gen's own generation step). Still
# required even though maturin isn't the build-backend below anymore -
# scripts/build_backend.py calls straight into maturin's own PEP 517
# functions for thread_aio.
requires = ["maturin>=1.9.4,<2.0"]
# scripts/build_backend.py is a thin wrapper around maturin (see its own
# module docstring) that additionally builds the Linux-only linux_aio/
# linux_uring sibling crates and merges their .abi3.so into the wheel
# maturin produces for thread_aio - replacing the old mechanism where
# src/thread_aio/build.rs built them as a side effect of its own cargo
# build. Not named build.py at the repo root: `python -m build` (used
# throughout CI/Makefile) adds cwd to sys.path first, and a top-level
# build.py would then shadow the real PyPA `build` package on `import
# build`.
backend-path = ["scripts"]
build-backend = "build_backend"

[project]
name = "caio"
version = "0.10.2"
license = "Apache-2.0"
license-files = ["COPYING"]
description = "Asynchronous file IO for Linux MacOS or Windows."
readme = "README.md"
authors = [{ name = "Dmitry Orlov", email = "me@mosquito.su"}]
requires-python = ">=3.10"
classifiers = [
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Operating System :: Microsoft",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
"Source Code" = "https://github.com/mosquito/caio/"

[project.optional-dependencies]
develop = [
  "aiomisc-pytest",
  "coveralls",
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.maturin]
# thread_aio is the crate maturin builds directly (via
# scripts/build_backend.py's own delegation - see that file) - not an
# arbitrary choice: it's the only backend that needs PyO3's
# platform-specific extension-module linker flags (e.g. macOS's
# `-undefined dynamic_lookup`), which only get set up correctly when
# maturin itself invokes cargo for a crate it's managing. linux_aio/
# linux_uring don't have that problem (Linux .so files link fine without
# those flags), which is exactly why they - and only they - are built via
# a plain `cargo build` from build_backend.py instead of through maturin
# at all.
manifest-path = "src/thread_aio/Cargo.toml"
module-name = "caio.thread_aio"
python-source = "."
# Because linux_aio/linux_uring aren't a real Cargo dependency of
# thread_aio, `cargo package`/maturin's own sdist logic has no way to
# know their source exists, so it needs an explicit include - this part
# is unchanged, build_sdist still delegates straight to maturin (see
# build_backend.py). tests/ is included too so an extracted sdist can run
# its own test suite (this used to need a setuptools packages.find
# include - see 1d9a861 - maturin's own sdist packaging needs the
# equivalent). scripts/build_backend.py itself needs an entry for the
# same reason: it isn't part of any Cargo crate, so nothing else would
# pull it into the sdist - without it, a from-sdist build fails outright
# (backend-path=["scripts"] resolving to nothing).
#
# There is no wheel-format entry for caio/linux_aio*.so/caio/
# linux_uring*.so anymore - those used to be picked up by maturin's own
# glob-based wheel packaging (built as a side effect of thread_aio's old
# build.rs); now build_backend.py builds them itself and injects them
# into the wheel directly, after maturin's own thread_aio-scoped wheel
# build already ran.
#
# caio-backend-linux-aio (linux_aio's own path-dependency driver crate,
# not thread_aio's) needs the same explicit treatment for the same
# reason: it's real to linux_aio's Cargo.toml, but not to thread_aio's,
# so cargo's own automatic path-dependency inclusion (which is why
# caio-core/caio-backend-thread need no entry here - they're genuine
# dependencies of thread_aio itself) never sees it. Each future
# caio-backend-* driver crate needs the same entry added here the first
# time some sibling starts depending on it.
include = [
  { path = "src/linux_aio/**/*", format = "sdist" },
  { path = "src/linux_uring/**/*", format = "sdist" },
  { path = "src/caio-backend-linux-aio/**/*", format = "sdist" },
  { path = "src/caio-backend-uring/**/*", format = "sdist" },
  { path = "scripts/build_backend.py", format = "sdist" },
  { path = "tests/**/*", format = "sdist" },
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["C901", "E252"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated by pyo3-stub-gen (see src/*/lib.rs's stub_info()) - not
# hand-maintained, so cosmetic-only lint issues in its output aren't worth
# post-processing the generated file to satisfy.
"caio/thread_aio.pyi" = ["I001", "PYI029", "RUF100"]
"caio/linux_aio.pyi" = ["I001", "PYI029", "RUF100"]
"caio/linux_uring.pyi" = ["I001", "PYI029", "RUF100"]

[dependency-groups]
dev = [
    "rich",
]
